<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================
   DMS Grant Desk — tokens
   Brand comes from the Grant Ready Binder: navy #1F3A5F, gold
   #C9A227. Light is warm archival paper; dark is a navy night.
   Gold is reserved for the rubric and for deadline urgency.
   Pass / needs-work / fail are semantic and always labelled.
   ============================================================ */
:root {
  --paper:        #F3F1E9;
  --surface:      #FFFFFF;
  --sunk:         #E9E5D9;
  --ink:          #1A2233;
  --ink-2:        #4E576B;
  --ink-3:        #7D8698;
  --rule:         #DED8C8;
  --rule-strong:  #C3BAA4;
  --navy:         #1F3A5F;
  --masthead-bg:  #16283F;
  --masthead-ink: #EFEAD9;
  --masthead-dim: #9FAEC4;
  --gold:         #8A6A15;
  --gold-bright:  #C9A227;
  --pass:         #15634A;
  --work:         #8A5B12;
  --fail:         #96261F;
  --flagink:      #7A4A12;
  --flagbg:       #F8EFDC;
  --bar:          #1F3A5F;
  --bar-soft:     #E4DFCF;
  --lost:         #E0D7BF;
  --shadow:       0 1px 2px rgba(26,34,51,.06), 0 10px 26px -18px rgba(26,34,51,.3);
  --focus:        #1F5C8F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101620;
    --surface:      #18202D;
    --sunk:         #0B1017;
    --ink:          #E9E7DD;
    --ink-2:        #ADB4C2;
    --ink-3:        #7E8798;
    --rule:         #2A3444;
    --rule-strong:  #3E4A5D;
    --navy:         #2A4872;
    --masthead-bg:  #0A0F17;
    --masthead-ink: #EFEAD9;
    --masthead-dim: #8D9BB1;
    --gold:         #D9B45A;
    --gold-bright:  #E3C377;
    --pass:         #4FA687;
    --work:         #D19E4A;
    --fail:         #E07A72;
    --flagink:      #D6A15E;
    --flagbg:       #241C10;
    --bar:          #5C8DC4;
    --bar-soft:     #232C3C;
    --lost:         #2A3346;
    --shadow:       0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.75);
    --focus:        #79AEE0;
  }
}
:root[data-theme="dark"] {
  --paper:        #101620;
  --surface:      #18202D;
  --sunk:         #0B1017;
  --ink:          #E9E7DD;
  --ink-2:        #ADB4C2;
  --ink-3:        #7E8798;
  --rule:         #2A3444;
  --rule-strong:  #3E4A5D;
  --navy:         #2A4872;
  --masthead-bg:  #0A0F17;
  --masthead-ink: #EFEAD9;
  --masthead-dim: #8D9BB1;
  --gold:         #D9B45A;
  --gold-bright:  #E3C377;
  --pass:         #4FA687;
  --work:         #D19E4A;
  --fail:         #E07A72;
  --flagink:      #D6A15E;
  --flagbg:       #241C10;
  --bar:          #5C8DC4;
  --bar-soft:     #232C3C;
  --lost:         #2A3346;
  --shadow:       0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.75);
  --focus:        #79AEE0;
}

* { box-sizing: border-box; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: Newsreader, Georgia, "Times New Roman", serif;
  text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -.004em;
}

.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

a { color: var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

/* ---------- masthead ---------- */
.masthead { background: var(--masthead-bg); color: var(--masthead-ink); border-bottom: 3px solid var(--gold-bright); }
.masthead-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px 12px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline; }
.brandmark { font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 600; letter-spacing: .005em; }
.brandmark em { font-style: normal; color: var(--gold-bright); }
.brandsub { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--masthead-dim); }
.masthead-doc { margin-left: auto; text-align: right; font-size: 12px; color: var(--masthead-dim); max-width: 440px; }
.masthead-doc strong { display: block; color: var(--masthead-ink); font-weight: 500; font-size: 13px; }

/* ---------- tab rail ---------- */
.rail { background: var(--surface); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.rail-in { max-width: 1180px; margin: 0 auto; padding: 0 20px; display: flex; gap: 2px; overflow-x: auto; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  font: 500 13px/1 "IBM Plex Sans", sans-serif; color: var(--ink-3);
  padding: 14px 12px 11px; border-bottom: 3px solid transparent;
  white-space: nowrap; display: flex; align-items: center; gap: 7px;
}
.tab:hover:not(:disabled) { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold-bright); }
.tab:disabled { opacity: .38; cursor: not-allowed; }
.tab .num { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); }
.tab[aria-selected="true"] .num { color: var(--gold); }

/* ---------- shell ---------- */
main { max-width: 1180px; margin: 0 auto; padding-block: 26px 72px; padding-left: 20px; padding-right: 20px; }
.stack { display: flex; flex-direction: column; gap: 22px; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }

.eyebrow { font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 66ch; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); }
.panel-pad { padding: 18px 20px; }
.panel-head { padding: 13px 20px; border-bottom: 1px solid var(--rule); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel-head h3 { font-size: 16.5px; }
.panel-head .note { font-size: 12px; color: var(--ink-3); margin-left: auto; }

/* ---------- controls ---------- */
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
input[type="text"], input[type="number"], textarea, select {
  font: 400 14px/1.5 "IBM Plex Sans", sans-serif; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 2px;
  padding: 8px 10px; width: 100%; max-width: 100%;
}
textarea { resize: vertical; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; line-height: 1.6; }
input:focus, textarea:focus, select:focus { border-color: var(--focus); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }

button.btn {
  appearance: none; cursor: pointer; font: 600 13px/1 "IBM Plex Sans", sans-serif;
  padding: 11px 17px; border-radius: 2px; border: 1px solid var(--navy);
  background: var(--navy); color: #fff; letter-spacing: .01em;
  display: inline-flex; align-items: center; gap: 8px;
}
button.btn:hover:not(:disabled) { filter: brightness(1.16); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
button.btn.ghost:hover:not(:disabled) { border-color: var(--ink-3); filter: none; }
button.btn.sm { padding: 7px 11px; font-size: 12px; }
button.link {
  appearance: none; background: none; border: 0; padding: 0; cursor: pointer;
  font: 500 12.5px/1.4 "IBM Plex Sans", sans-serif; color: var(--focus); text-decoration: underline;
  text-underline-offset: 2px;
}

/* ---------- status pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 2px;
  font: 600 10.5px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; text-transform: uppercase;
  padding: 5px 8px; border: 1px solid currentColor; white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok { color: var(--pass); }
.pill.no { color: var(--fail); }
.pill.unk { color: var(--ink-3); }
.pill.warn { color: var(--work); }
.pill.info { color: var(--focus); }

/* ---------- countdown band ---------- */
.band {
  border-left: 4px solid var(--rule-strong); background: var(--surface);
  border-top: 1px solid var(--rule); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px;
}
.band.urgent { border-left-color: var(--gold-bright); }
.band.past { border-left-color: var(--fail); }
.band .big { font-family: "IBM Plex Mono", monospace; font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.band.urgent .big { color: var(--gold); }
.band.past .big { color: var(--fail); }
.band .unit { font-size: 12px; color: var(--ink-2); max-width: 22ch; }
.band .when { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--ink-2); }
.band .when strong { display: block; font-size: 14px; color: var(--ink); font-weight: 500; }

/* ---------- definition rows ---------- */
.dl { display: grid; grid-template-columns: minmax(150px, 34%) 1fr; }
.dl dt { padding: 9px 14px 9px 0; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); font-weight: 500; }
.dl dd { padding: 9px 0; border-top: 1px solid var(--rule); margin: 0; font-size: 13.5px; }
.dl dt:first-of-type, .dl dd:first-of-type { border-top: 0; }
.null { color: var(--ink-3); font-style: italic; font-size: 12.5px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 "IBM Plex Sans", sans-serif; padding: 6px 9px; border-radius: 2px;
  background: var(--sunk); color: var(--ink-2); border: 1px solid transparent;
}

/* ---------- rubric ledger ----------
   Two segments per criterion: points the evidence supports (navy) and
   points left on the table (pale). One scale across every row. */
.ledger { display: flex; flex-direction: column; }
.crit { padding: 14px 0; border-top: 1px solid var(--rule); }
.crit:first-child { border-top: 0; }
.crit-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.crit-head h4 { font-size: 15.5px; flex: 1; min-width: 200px; }
.crit-pts { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.crit-pts b { font-weight: 600; font-size: 16px; }
.crit-pts span { color: var(--ink-3); }
.crit-track { height: 10px; background: var(--bar-soft); border-radius: 5px; margin: 9px 0 0; overflow: hidden; display: flex; }
.crit-earn { height: 100%; background: var(--bar); }
.crit-gap { height: 100%; background: var(--lost); }
.crit-why { font-size: 13px; color: var(--ink-2); margin: 9px 0 0; max-width: 78ch; }
.crit-lift { font-size: 13px; margin: 8px 0 0; padding: 9px 12px; background: var(--flagbg); color: var(--flagink); border-left: 3px solid var(--gold-bright); border-radius: 2px; max-width: 78ch; }
.crit-lift b { font-weight: 600; }
.crit-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }

/* ---------- score hero ---------- */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start; padding: 24px 20px; }
.scoreblock { text-align: center; min-width: 170px; }
.scorenum { font-family: "IBM Plex Mono", monospace; font-size: 68px; font-weight: 600; line-height: .92; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.scoreof { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }
.meter { height: 7px; background: var(--bar-soft); border-radius: 4px; margin-top: 12px; overflow: hidden; }
.meterfill { height: 100%; border-radius: 0 4px 4px 0; background: var(--gold-bright); }
.stamp {
  display: inline-block; border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: 3px;
  padding: 9px 16px; transform: rotate(-1.4deg);
  font: 600 15px/1 "IBM Plex Mono", monospace; letter-spacing: .15em; text-transform: uppercase;
}
.stamp.go { color: var(--pass); }
.stamp.work { color: var(--work); }
.stamp.nogo { color: var(--fail); }

/* ---------- registration runway ----------
   A single day-scale: every segment is lead time in days, the rule at
   the end is the deadline. Overrun is drawn past the rule in red. */
.runway { display: flex; flex-direction: column; gap: 10px; }
.runbar { display: flex; height: 26px; border: 1px solid var(--rule-strong); border-radius: 3px; overflow: hidden; background: var(--sunk); }
.runseg { height: 100%; display: flex; align-items: center; justify-content: center; font: 600 10px/1 "IBM Plex Mono", monospace; color: #fff; overflow: hidden; border-right: 1px solid rgba(255,255,255,.35); }
.runseg.done { background: var(--pass); }
.runseg.todo { background: var(--navy); }
.runseg.over { background: var(--fail); }
.runseg.slack { background: transparent; color: var(--ink-3); border-right: 0; }
.runscale { display: flex; justify-content: space-between; font: 500 11px/1 "IBM Plex Mono", monospace; color: var(--ink-3); }
.runlegend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.runlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
table.grid th {
  text-align: left; font: 600 10.5px/1.3 "IBM Plex Mono", monospace; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rule-strong);
  vertical-align: bottom;
}
table.grid td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid th:last-child, table.grid td:last-child { padding-right: 0; }
table.grid td.num, table.grid th.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

/* ---------- lists ---------- */
ul.marks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
ul.marks li { padding: 9px 0 9px 20px; border-top: 1px solid var(--rule); position: relative; font-size: 13.5px; }
ul.marks li:first-child { border-top: 0; }
ul.marks li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 1.5px; background: var(--ink-3); }
ul.marks.flags li::before { background: var(--flagink); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; align-items: start; }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }

.notice { border: 1px solid var(--rule); border-left: 3px solid var(--flagink); background: var(--flagbg); color: var(--flagink); padding: 12px 15px; font-size: 13px; border-radius: 2px; }
.notice strong { color: inherit; }
.notice.plain { background: var(--surface); border-left-color: var(--rule-strong); color: var(--ink-2); }
.notice.bad { border-left-color: var(--fail); color: var(--fail); background: var(--surface); }
.notice.good { border-left-color: var(--pass); color: var(--pass); background: var(--surface); }

.progress { display: flex; flex-direction: column; gap: 9px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.step { font: 500 11.5px/1 "IBM Plex Mono", monospace; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-3); }
.step.now { border-color: var(--gold-bright); color: var(--gold); }
.step.done { color: var(--pass); border-color: var(--pass); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
.step.now { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .step.now { animation: none; } }

.rowedit { border: 1px solid var(--rule); border-radius: 3px; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.rowedit .rowhead { display: flex; align-items: center; gap: 12px; }
.rowedit .rowhead h4 { font-size: 15px; flex: 1; min-width: 0; }
.fieldgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }

/* ---------- source rows and search hits ---------- */
.srcrow { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.6fr) 110px minmax(0,1.4fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
.srcrow:first-of-type { border-top: 0; }
.srcrow a { font-size: 12.5px; word-break: break-all; }
@media (max-width: 860px) { .srcrow { grid-template-columns: 1fr; gap: 6px; } }

.hits { display: flex; flex-direction: column; gap: 12px; }
.hit { border: 1px solid var(--rule); border-left: 3px solid var(--navy); border-radius: 2px; padding: 13px 15px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.hit.soon { border-left-color: var(--gold-bright); }
.hit-top { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: baseline; }
.hit-top h4 { font-size: 15px; flex: 1; min-width: 200px; }
.hit-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.hit-meta b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.hit p.desc { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 78ch; }
.hit-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- check findings ----------
   Arithmetic and judgment are visually separate on purpose: one is
   computed in the page, the other is Claude's reading. */
.finding { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.finding:first-child { border-top: 0; }
.finding .sev { font: 600 10px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; text-transform: uppercase; padding: 5px 7px; border: 1px solid currentColor; border-radius: 2px; height: fit-content; white-space: nowrap; }
.finding .sev.blocker { color: var(--fail); }
.finding .sev.fix { color: var(--work); }
.finding .sev.note { color: var(--ink-3); }
.finding .sev.clean { color: var(--pass); }
.finding p { margin: 0; font-size: 13.5px; }
.finding .where { font: 500 12px/1.4 "IBM Plex Mono", monospace; color: var(--ink-3); margin-top: 3px; }
.finding .fixline { font-size: 13px; color: var(--ink-2); margin-top: 5px; }

.filedrop { border: 1px dashed var(--rule-strong); border-radius: 3px; padding: 18px; text-align: center; background: var(--sunk); }
.filedrop p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.sheettable { max-height: 260px; overflow: auto; border: 1px solid var(--rule); border-radius: 2px; }

.tallies { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.tally { display: flex; flex-direction: column; gap: 2px; }
.tally b { font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tally span { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

.verify { color: var(--flagink); font-weight: 600; }

@media (max-width: 660px) {
  .hero { grid-template-columns: 1fr; gap: 20px; }
  .scoreblock { text-align: left; }
  .dl { grid-template-columns: 1fr; }
  .dl dt { padding-bottom: 0; border-top: 1px solid var(--rule); }
  .dl dd { padding-top: 2px; border-top: 0; }
  .dl dd:first-of-type { border-top: 0; }
  .band .when { margin-left: 0; text-align: left; width: 100%; }
  .masthead-doc { margin-left: 0; text-align: left; }
  .finding { grid-template-columns: 1fr; gap: 6px; }
}
</style>

<div id="root">
  <div style="max-width:1180px;margin:0 auto;padding:60px 20px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:13px">

  </div>
</div>

/* Pull what a URL can actually tell us: the site, and the opportunity's
   own number where the URL carries it. A Grants.gov detail URL carries a
   numeric oppId; most agency URLs carry the opportunity number itself. */
function parseSourceUrl(raw) {
  var out = { url: "", host: "", siteLabel: "", kind: "", oppNumber: "", oppId: "" };
  var v = String(raw || "").trim();
  if (!v) return out;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  var u;
  try { u = new URL(v); } catch (e) { return out; }
  out.url = u.href;
  out.host = u.hostname.replace(/^www\./i, "");
  for (var i = 0; i < KNOWN_SITES.length; i++) {
    if (KNOWN_SITES[i].re.test(u.hostname)) { out.siteLabel = KNOWN_SITES[i].label; out.kind = KNOWN_SITES[i].kind; break; }
  }
  if (!out.siteLabel) out.siteLabel = out.host;
  var oppId = u.searchParams.get("oppId") || u.searchParams.get("oppid");
  if (!oppId) {
    var m = u.pathname.match(/\/(?:search-results-detail|opportunity|view-opportunity)\/(\d{4,})/i);
    if (m) oppId = m[1];
  }
  if (oppId) out.oppId = oppId;
  var whole = decodeURIComponent(u.pathname + "?" + u.search);
  var num = whole.match(/\b([A-Z]{2,6}(?:-[A-Z0-9]{1,8}){2,5})\b/);
  if (num) out.oppNumber = num[1];
  return out;
}

  if (code === "server_not_connected")
    return { text: "The " + KINDORA_SERVER + " connector is not on this account. Add it in claude.ai Settings \u2192 Connectors, then search again.", retry: false };
  if (code === "needs_reauth")
    return { text: "The " + KINDORA_SERVER + " connector needs reconnecting. Do that in claude.ai Settings \u2192 Connectors, then search again.", retry: false };
  if (code === "selection_required")
    return { text: "There is more than one connector by that name on this account. Choose one when Claude asks, then search again.", retry: false };
  if (code === "not_in_manifest")
    return { text: "Live search is not allowed for this page on this view \u2014 the connector was declined or switched off for it. Paste the notice text instead.", retry: false };
  if (code === "blocked_by_policy")
    return { text: "Your organization blocks this connector. Paste the notice text instead.", retry: false };
  if (code === "approval_required")
    return { text: "This connector requires per-call approval, which a page cannot ask for yet. Paste the notice text instead.", retry: false };
  if (code === "server_not_found")
    return { text: "That connector no longer exists upstream. Paste the notice text instead.", retry: false };
  if (code === "server_unavailable")
    return { text: "Kindora did not answer in time. Press Search again in a moment.", retry: true };
  if (code === "rate_limited")
    return { text: "Too many searches at once. Wait a few seconds and search again.", retry: true };
  if (code === "tool_error")
    return { text: "The search ran but reported a problem: " + (e.message || "no detail given") + ".", retry: false };
  if (code === "bad_request" || code === "transform_error")

  if (code === "consent_required")

}

    (txt(g.funder_ein) ? " \u2014 EIN " + txt(g.funder_ein) : ""));
  L.push("SOURCE TYPE: " + (txt(g.source) || "not stated"));
  L.push("");
  if (txt(g.description)) { L.push("DESCRIPTION:"); L.push(txt(g.description)); L.push(""); }
  L.push("DEADLINE: " + (txt(g.deadline) || "not stated") +
    (txt(g.deadline_type) ? " (" + txt(g.deadline_type).replace(/_/g, " ") + ")" : "") +
    (num(g.days_until_close) !== null ? " \u2014 " + num(g.days_until_close) + " days out" : ""));
  L.push("AWARD RANGE: " + (txt(g.grant_range) || "not stated"));
  if (txt(g.intake_type)) L.push("HOW TO APPLY: " + txt(g.intake_type) +
    (g.accepts_unsolicited === true ? " \u2014 accepts unsolicited requests" :
     (g.accepts_unsolicited === false ? " \u2014 does NOT accept unsolicited requests" : "")));
  if (asArr(g.focus_areas).length) { L.push(""); L.push("FOCUS AREAS:"); asArr(g.focus_areas).forEach(function (f) { L.push("  - " + txt(f)); }); }
  if (asArr(g.geographic_focus).length) { L.push(""); L.push("GEOGRAPHIC FOCUS:"); asArr(g.geographic_focus).forEach(function (f) { L.push("  - " + txt(f)); }); }
  if (txt(g.application_url)) { L.push(""); L.push("APPLICATION LINK: " + txt(g.application_url)); }
  L.push("");
  L.push("--- PASTE THE FUNDER'S FULL NOTICE BELOW THIS LINE ---");
  L.push("");
  return L.join("\n");
}

function isStr(v) { return typeof v === "string" && v.trim() !== ""; }
function asArr(v) { return Array.isArray(v) ? v : []; }
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  var s = v.replace(/[$,\s]/g, "").replace(/[()]/g, "");
  if (s === "" || !/^-?\d*\.?\d+%?$/.test(s)) return null;
  var neg = /^\(.*\)$/.test(v.trim());
  var n = parseFloat(s);
  if (!isFinite(n)) return null;
  return neg ? -n : n;
}
function txt(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "string") return v.trim() === "" ? null : v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  if (Array.isArray(v)) return v.map(txt).filter(Boolean).join("; ") || null;
  if (typeof v === "object") {
    var parts = Object.keys(v).map(function (k) {
      var t = txt(v[k]); return t ? k + ": " + t : null;
    }).filter(Boolean);
    return parts.length ? parts.join(" · ") : null;
  }
  return String(v);
}
function linesToArr(s) { return String(s || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
function arrToLines(a) { return asArr(a).join("\n"); }
function isPending(v) { return typeof v === "string" && /^\s*(PENDING|VERIFY|TBD|UNKNOWN)\s*$/i.test(v); }
function money(n) {
  if (typeof n !== "number" || !isFinite(n)) return "—";
  var s = Math.abs(n) >= 1000 ? Math.round(n).toLocaleString() : (Math.round(n * 100) / 100).toLocaleString();
  return (n < 0 ? "-$" : "$") + s;
}

var CLIENT_FIELDS = [
  "ein","orgType","taxExemptStatus","nteeCode","yearEstablished","stateOfIncorporation",
  "physicalAddress","mailingAddress","phone","email","website","serviceArea",
  "uei","cage","samStatus","samExpires","grantsGovStatus","aorName","ebizPoc","loginGovHolder",
  "authorizedOfficial","boardCount","annualBudget","fiscalYearEnd","auditStatus","indirectRate","staffCount"
];
function countPending(client) {
  return CLIENT_FIELDS.filter(function (k) { return isPending(client[k]); }).length;
}

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parseDate(v) {
  if (!isStr(v)) return null;
  var s = v.trim();
  var iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
  var us = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (us) return new Date(+us[3], +us[1] - 1, +us[2]);
  var named = s.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/);
  if (named) {
    var mi = MONTHS.findIndex(function (m) { return m.toLowerCase().indexOf(named[1].toLowerCase().slice(0, 3)) === 0; });
    if (mi >= 0) return new Date(+named[3], mi, +named[2]);
  }
  return null;
}
function fmtDate(d) { return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function daysUntil(d) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((t - today) / 86400000);
}

/* The sample capability caps input at 64 KiB. 40k characters per pass
   leaves room for the instruction riding along with it. */
var CHUNK_CHARS = 40000;
function chunkText(text, size) {
  size = size || CHUNK_CHARS;
  if (text.length <= size) return [text];
  var paras = text.split(/\n\s*\n/);
  var out = [], cur = "";
  for (var i = 0; i < paras.length; i++) {
    var p = paras[i];
    while (p.length > size) {
      if (cur) { out.push(cur); cur = ""; }
      out.push(p.slice(0, size));
      p = p.slice(size);
    }
    if ((cur + "\n\n" + p).length > size) { if (cur) out.push(cur); cur = p; }
    else { cur = cur ? cur + "\n\n" + p : p; }
  }
  if (cur) out.push(cur);
  return out;
}
function clip(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n) + "\n…[trimmed]" : s; }

   4. THE PROMPTS
   Pass A reads the notice. Pass B scores the client against it. Pass C

var EXTRACT_SCHEMA =
  '{ opportunityNumber, title, funder, program, assistanceListing, opportunityType, ' +
  'contacts:{programOfficer:{name,phone,email}, grantsManagement}, ' +
  'dates:{letterOfIntent, questionsDeadline, applicationDeadline, deadlineTime, timezone, awardNotice, projectStart}, ' +
  'award:{totalProgramFunding, expectedAwards, ceiling, floor, projectPeriod, budgetPeriods}, ' +
  'costShare:{required:true|false|null, percent, basis, inKindAllowed, notes}, ' +
  'indirectCost:{policy, capPercent, deMinimisAllowed, notes}, ' +
  'eligibility:[{requirement, hard:true|false, citation}], ineligibleEntities[], ' +
  'submission:{portal, pageLimit, pageLimitAppliesTo, font, spacing, margins, fileFormat, fileNamingRules, abstractLimit, otherLimits[]}, ' +
  'requiredForms:[{name, note, citation}], requiredAttachments:[{name, note, citation}], ' +
  'reviewCriteria:[{criterion, points, whatReviewersLookFor, subElements[], citation}], ' +
  'bonusPoints:{available:true|false|null, points, basis}, ' +
  'scoreThresholds:{minimumScore, historicalFundedScore, notes}, ' +
  'unallowableCosts[], reportingRequirements[], redFlags[], competitiveNotes }';

function promptExtract(text, part, total) {
  var scopeNote = total > 1
    ? "\n\nThis is part " + part + " of " + total + " of a longer notice. Extract only what this part states. Leave every field this part does not cover as null or an empty array — a later pass merges the parts."
    : "";
  return [
    "You are a grants analyst reading a notice of funding opportunity (a federal NOFO/NOFA, a state RFA, or a private foundation RFP).",
    "Extract structured data from the text below. Return ONLY valid JSON matching this schema, with no preamble and no markdown fences.",
    "",
    "Schema: " + EXTRACT_SCHEMA,
    "",
    "Rules:",
    "- Quote requirement language verbatim where precision matters.",
    "- If a field is not stated, use null — never infer. A foundation RFP that states no page limit gets null, not a guess.",
    "- Cite the section number for every requirement, criterion and attachment in its citation field (e.g. \"§5.3\", \"IV.7(k)\").",
    "- Dates: give the full calendar date (month, day, year) as stated.",
    "- reviewCriteria is the scoring rubric and is the most important part of this extraction. One entry per scored criterion, with its point value as a number when stated (null otherwise). whatReviewersLookFor must capture, in the notice's own terms, what earns points — including any sentence that tells you what will NOT score well. subElements lists the distinct things the criterion asks for, each as a short phrase.",
    "- If the notice describes review without point values (common for foundations), still list each criterion with points null.",
    "- eligibility: set hard true for a gate that disqualifies an applicant outright (entity type, status, geography, one-application limits, audit findings), false for a preference or a capability the reviewers merely weigh.",
    "- Keep requiredForms (government forms: SF-424 family, certifications) separate from requiredAttachments (documents the applicant writes or supplies).",
    "- Flag as a redFlag: a deadline under 30 days out, a cost-share requirement the notice does not let you waive, a mandatory registration the applicant may not hold yet, an unusually low award floor against a heavy reporting burden, uncapped liability or indemnification, a stated minimum score, and any already-past date.",
    scopeNote,
    "",
    "NOTICE TEXT:",
    text
  ].join("\n");
}

function promptMerge(accJson, nextJson) {
  return [
    "You are a grants analyst reconciling two partial extractions of the SAME funding notice into one record.",
    "Return ONLY valid JSON matching this schema, with no preamble and no markdown fences.",
    "",
    "Schema: " + EXTRACT_SCHEMA,
    "",
    "Rules:",
    "- Union every array; drop duplicate and near-duplicate entries, keeping the more complete wording and its citation.",
    "- reviewCriteria: never merge two distinct criteria into one, and never drop one. If both records carry the same criterion, keep the version with the fuller whatReviewersLookFor.",
    "- For scalar fields, prefer a stated value over null. If the two disagree, keep the more specific value and add a redFlag naming the conflict.",
    "- Never invent a value that appears in neither record.",
    "",
    "RECORD A:",
    JSON.stringify(accJson),
    "",
    "RECORD B:",
    JSON.stringify(nextJson)
  ].join("\n");
}

function promptAssess(client, docs, brief) {
  var dimLine = READINESS_DIMS.map(function (d) { return d.key + " (0-" + d.max + ")"; }).join(", ");
  return [
    "You are a grant consultant at a small Delaware firm that prepares clients to apply for grants. You are advising on ONE client organization against ONE funding notice. Your client pays you to tell them the truth before they spend six weeks writing.",
    "",
    "CLIENT ORGANIZATION:",
    clip(JSON.stringify(client), 12000),
    "",
    "DOCUMENTS ON FILE (status is the client's own record; \"missing\" means nobody has it yet):",
    clip(JSON.stringify(docs), 6000),
    "",
    "FUNDING NOTICE (already extracted):",
    clip(JSON.stringify(brief), 30000),
    "",
    "Return ONLY JSON, no preamble and no markdown fences, matching:",
    '{ eligibility:[{requirement, met:true|false|"unknown", evidence, blocking:true|false}], ',
    "readinessScores:{" + dimLine + "}, ",
    "rubricScoring:[{criterion, maxPoints, supportedPoints, evidenceOnFile, whatIsMissing, howToGainPoints, liftPoints}], ",
    "projectedScore, projectedMax, ",
    "missingItems:[{item, binderTab, why, blocksSubmission:true|false, leadTimeDays, owner}], ",
    "strengths[], weaknesses[], competitiveRead, estimatedEffortHours, ",
    'recommendation:"GO"|"GO WITH WORK"|"NO-GO", rationale }',
    "",
    "Rules:",
    "- Be blunt. A client loses more on an application that was never competitive than on one they never started.",
    "- rubricScoring must contain exactly one entry per criterion in the notice's reviewCriteria, in the same order, with maxPoints copied from it.",
    "- supportedPoints is the score a reviewer would give TODAY, reading only what this client can currently evidence. It is not a target and not a hope. If the client has no outcome data, a 20-point evaluation criterion does not score 15.",
    "- liftPoints is how many additional points are realistically reachable before the deadline, and howToGainPoints says what specifically to add to earn them. Name the artifact, not the aspiration: \"name the literacy curriculum and its dose (sessions/week x weeks)\", not \"strengthen the approach\".",
    "- whatIsMissing is what the reviewer will not find in the file as it stands.",
    "- projectedScore is the sum of supportedPoints. projectedMax is the sum of maxPoints. Do not include bonus points in either.",
    "- Never credit a field whose value is PENDING, VERIFY, TBD or blank. Treat it as unknown, say so in the evidence, and score it as unsupported. A PENDING value is never evidence of compliance.",
    '- Use met:"unknown" only where the record genuinely does not say. Set blocking true where failing the gate ends the application.',
    "- readinessScores judge whether a COMPLETE package can be submitted on time, which is a different question from whether it would win. Score registrations on the actual chain (SAM active and unexpired, UEI, Grants.gov profile, an authorized AOR), not on intent.",
    "- missingItems: one entry per thing the client still has to obtain or write. binderTab is 1-6 matching the Grant Ready Binder (1 Organizational, 2 Tax-Exempt, 3 Financial, 4 Federal Registration, 5 Authorized Official & Governance, 6 Funding Strategy). leadTimeDays is a realistic number of calendar days to obtain it. Set blocksSubmission true only where the package cannot be submitted without it.",
    "- estimatedEffortHours is a number: hours to write and assemble a responsive application.",
    "- recommendation: NO-GO if a hard gate fails or the registration chain cannot clear before the deadline. GO WITH WORK if it is winnable only after named work lands. GO if the client is competitive as they stand.",
    "- rationale is 2-5 sentences. If NO-GO, the first sentence states plainly why to walk away.",
    "- If the notice states a minimum score or a historical funded score, say in competitiveRead how the projected score compares to it."
  ].join("\n");
}

function promptDocCheck(kind, label, content, computed, brief, criterion) {

    "DOCUMENT NAME: " + (label || "untitled"),
    "",
    "WHAT THE PAGE ALREADY COMPUTED (treat as established; do not recompute, do not repeat it back as your own finding):",
    computed && computed.length ? computed.map(function (f) { return "- [" + f.severity + "] " + f.claim + (f.where ? " (" + f.where + ")" : ""); }).join("\n") : "- Nothing flagged by the arithmetic checks.",
    "",
    "THE FUNDING NOTICE'S RULES (what this document has to satisfy):",
    clip(JSON.stringify({
      costShare: brief && brief.costShare, indirectCost: brief && brief.indirectCost,
      award: brief && brief.award, submission: brief && brief.submission,
      unallowableCosts: brief && brief.unallowableCosts,
      reviewCriteria: brief && brief.reviewCriteria
    }), 18000),

    "",

    "Return ONLY JSON, no preamble and no markdown fences, matching:",

    "rubricLinkage:[{criterion, coveredWell, whatIsMissing}], summary }",

    "Rules:",
    "- severity blocker: the notice would reject the package, or a reviewer would score it near zero on a criterion. fix: it costs real points or invites a question. note: a tightening worth making if there is time.",
    "- where must let someone find it: a line item label, a heading, a row number, a quoted phrase. Never \"throughout\".",
    "- fix states the specific edit to make, in one sentence.",
    "- Check against the notice, not against general practice: unallowable cost categories, the indirect cost policy, the cost-share basis, award ceiling and floor, page and format limits, file naming rules.",
    "- For a budget: is every line allocable to a stated activity, is the basis of each figure given (rate x quantity), does the narrative justify anything a reviewer would question, is the match documented rather than asserted.",
    "- For a narrative: does it answer every sub-element the criterion asks for, in the criterion's own order, with specifics (curriculum names, dose, baselines, cited data) rather than intentions.",
    "- Do not restate the computed findings above. Add only what reading the document tells you.",

/* ==================================================================
   5. THE ARITHMETIC — checks the page runs itself
   Everything in this section is computed here, in the browser, and is
   either right or wrong. Nothing in it is a model's opinion. The
   findings it produces are shown separately from Claude's reading, and
   they are handed to Claude as established fact so it does not
   recompute them.
   ================================================================== */
function parseDelimited(text) {
  var src = String(text || "").replace(/\r\n?/g, "\n").replace(/\n+$/, "");
  if (!src) return [];
  var firstLine = src.split("\n")[0];
  var delim = (firstLine.split("\t").length > firstLine.split(",").length) ? "\t" : ",";
  var rows = [], row = [], cell = "", q = false;
  for (var i = 0; i < src.length; i++) {
    var c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ""; }); })
             .map(function (r) { return r.map(function (x) { return String(x).trim(); }); });
}

function isTotalRow(label) { return /\b(total|subtotal|grand total|sum)\b/i.test(label || ""); }
function rowLabel(r) {
  for (var i = 0; i < r.length; i++) if (isStr(r[i]) && num(r[i]) === null) return r[i];
  return r[0] || "(unlabelled row)";
}

/* Which columns hold money: a column where most non-empty detail cells
   parse as numbers. */
function numericColumns(rows) {
  if (rows.length < 2) return [];
  var width = rows.reduce(function (w, r) { return Math.max(w, r.length); }, 0);
  var out = [];
  for (var c = 0; c < width; c++) {
    var filled = 0, numeric = 0;
    for (var r = 1; r < rows.length; r++) {
      var v = rows[r][c];
      if (!isStr(v)) continue;
      filled++;
      if (num(v) !== null) numeric++;
    }
    if (filled >= 2 && numeric / filled >= 0.7) out.push(c);
  }
  return out;
}

function headerFor(rows, c) { return (rows[0] && rows[0][c]) || "column " + (c + 1); }
function findCol(rows, cols, re) {
  for (var i = 0; i < cols.length; i++) if (re.test(headerFor(rows, cols[i]))) return cols[i];
  return -1;
}

function checkBudget(rows, brief) {
  var out = [];
  function add(sev, claim, where, fix) { out.push({ severity: sev, claim: claim, where: where || "", fix: fix || "", source: "arithmetic" }); }
  if (rows.length < 2) { add("note", "Not enough rows to check. Paste the budget with its header row.", "", "Include the header row and one row per line item."); return out; }

  var cols = numericColumns(rows);
  if (!cols.length) { add("note", "No money columns found, so no arithmetic was run.", "", "Give each amount its own column, with a header such as Federal request, Match, Total."); return out; }

  var totalCol = -1;
  for (var i = cols.length - 1; i >= 0; i--) { if (/total/i.test(headerFor(rows, cols[i]))) { totalCol = cols[i]; break; } }
  var fedCol = findCol(rows, cols, /federal|request|grant|award/i);
  var matchCol = findCol(rows, cols, /match|non-?federal|in-?kind|cost ?share|local/i);
  var partCols = cols.filter(function (c) { return c !== totalCol; });

  /* --- 1. each row's parts against its own total --- */
  if (totalCol >= 0 && partCols.length >= 1) {
    for (var r = 1; r < rows.length; r++) {
      var lbl = rowLabel(rows[r]);
      var stated = num(rows[r][totalCol]);
      if (stated === null) continue;
      var parts = 0, any = false;
      partCols.forEach(function (c) { var v = num(rows[r][c]); if (v !== null) { parts += v; any = true; } });
      if (!any) continue;
      var d = Math.round((parts - stated) * 100) / 100;
      if (Math.abs(d) >= 1) {
        add(isTotalRow(lbl) ? "blocker" : "fix",
          "This row does not cross-foot: " + partCols.map(function (c) { return headerFor(rows, c); }).join(" + ") +
          " comes to " + money(parts) + ", but the " + headerFor(rows, totalCol) + " column says " + money(stated) +
          " — a difference of " + money(Math.abs(d)) + ".",
          "Row: " + lbl,
          "Correct one of the two figures so the row adds up, then re-foot every column.");
      } else if (Math.abs(d) > 0) {
        add("note", "Row is off by " + money(Math.abs(d)) + " — rounding, not an error.", "Row: " + lbl, "Leave it, or round consistently to whole dollars.");
      }
    }
  }

  /* --- 2. each column against its stated totals, block by block --- */
  cols.forEach(function (c) {
    var block = 0, carried = 0, sawTotal = false;
    for (var r = 1; r < rows.length; r++) {
      var lbl = rowLabel(rows[r]);
      var v = num(rows[r][c]);
      if (isTotalRow(lbl)) {
        if (v === null) continue;
        var expect = /grand|project|^total$/i.test(lbl) && sawTotal ? carried + block : block;
        var d = Math.round((expect - v) * 100) / 100;
        if (Math.abs(d) >= 1) {
          add("blocker",
            "The " + headerFor(rows, c) + " column does not foot to its stated total: the line items above add to " +
            money(expect) + ", but the row says " + money(v) + " — a difference of " + money(Math.abs(d)) + ".",
            "Row: " + lbl + " · column: " + headerFor(rows, c),
            "Re-sum the column and correct the total. A budget that does not add up is the single most common reason a reviewer stops reading.");
        } else if (Math.abs(d) > 0) {
          add("note", "The " + headerFor(rows, c) + " column is off by " + money(Math.abs(d)) + " against " + lbl + " — rounding.", "Row: " + lbl, "Round consistently to whole dollars.");
        }
        carried += v; block = 0; sawTotal = true;
      } else if (v !== null) block += v;
    }
  });

  /* --- 3. a labelled percentage against the base it is drawn on --- */
  for (var r2 = 1; r2 < rows.length; r2++) {
    var lbl2 = rowLabel(rows[r2]);
    var pm = lbl2.match(/(?:at|@)\s*([\d.]+)\s*%/i);
    if (!pm) continue;
    var pct = parseFloat(pm[1]);
    var isIndirect = /indirect|f\s*&\s*a|overhead/i.test(lbl2);
    var isFringe = /fringe|benefit/i.test(lbl2);
    if (!isIndirect && !isFringe) continue;
    var refCol = fedCol >= 0 ? fedCol : cols[0];
    var mine = num(rows[r2][refCol]);
    if (mine === null) continue;
    var base = 0;
    for (var r3 = 1; r3 < rows.length; r3++) {
      if (r3 === r2) continue;
      var l3 = rowLabel(rows[r3]);
      if (isTotalRow(l3)) continue;
      if (isIndirect && /indirect|f\s*&\s*a|overhead/i.test(l3)) continue;
      var r3text = l3 + " " + rows[r3].join(" ");
      if (isFringe && !/personnel|salar|wage|\bFTE\b/i.test(r3text)) continue;
      if (isFringe && /travel|mileage|supplies|contractual|equipment|construction|indirect|rent|utilit/i.test(r3text)) continue;
      var v3 = num(rows[r3][refCol]);
      if (v3 !== null) base += v3;
    }
    if (base <= 0) continue;
    var expectAmt = Math.round(base * pct) / 100;
    var diff = Math.round((expectAmt - mine) * 100) / 100;
    if (Math.abs(diff) >= 2) {
      add("fix",
        "\"" + lbl2 + "\" does not equal " + pct + "% of its base: " + pct + "% of " + money(base) + " is " + money(expectAmt) +
        ", but the row claims " + money(mine) + ".",
        "Row: " + lbl2,
        "Either correct the amount or state in the budget narrative which base the rate is applied to.");
    }
  }

  /* --- 4. the indirect cost rate against the notice's cap --- */
  var ic = (brief && brief.indirectCost) || {};
  var cap = num(ic.capPercent);
  if (cap === null && /de ?minimis|10 ?%/i.test(txt(ic.policy) + " " + txt(ic.notes))) cap = 10;
  var indRow = -1;
  for (var r4 = 1; r4 < rows.length; r4++) {
    var l4 = rowLabel(rows[r4]);
    if (isTotalRow(l4)) continue;
    if (/indirect|f\s*&\s*a|overhead|administrative rate/i.test(l4)) { indRow = r4; break; }
  }
  if (indRow > 0) {
    var refC = fedCol >= 0 ? fedCol : cols[0];
    var indAmt = num(rows[indRow][refC]);
    var directBase = 0;
    for (var r5 = 1; r5 < rows.length; r5++) {
      if (r5 === indRow) continue;
      var l5 = rowLabel(rows[r5]);
      if (isTotalRow(l5)) continue;
      var v5 = num(rows[r5][refC]);
      if (v5 !== null) directBase += v5;
    }
    if (indAmt !== null && directBase > 0) {
      var actual = Math.round((indAmt / directBase) * 1000) / 10;
      if (cap !== null && actual > cap + 0.05) {
        add("blocker",
          "Indirect costs are " + actual + "% of direct costs, above the " + cap + "% this notice allows. That is " +
          money(indAmt - directBase * cap / 100) + " of unallowable indirect in the request.",
          "Row: " + rowLabel(rows[indRow]),
          "Reduce indirect to " + money(Math.round(directBase * cap / 100)) + ", or attach a current negotiated indirect cost rate agreement supporting the higher rate.");
      } else {
        add("clean", "Indirect costs are " + actual + "% of direct costs" + (cap !== null ? ", within the " + cap + "% this notice allows." : ". The notice states no cap, so verify the policy against the funder's guidance."),
          "Row: " + rowLabel(rows[indRow]), "");
      }
    }
  } else if (cap !== null) {
    add("note", "No indirect cost line found. The notice allows up to " + cap + "%.", "", "If the client is electing the de minimis rate, add the line and the written election statement the notice requires.");
  }

  /* --- 5. cost share against the required percentage --- */
  var cs = (brief && brief.costShare) || {};
  var reqPct = num(cs.percent);
  if (matchCol >= 0) {
    var matchTotal = 0, fedTotal = 0, projTotal = 0;
    for (var r6 = 1; r6 < rows.length; r6++) {
      var l6 = rowLabel(rows[r6]);
      if (isTotalRow(l6)) continue;
      var mv = num(rows[r6][matchCol]); if (mv !== null) matchTotal += mv;
      if (fedCol >= 0) { var fv = num(rows[r6][fedCol]); if (fv !== null) fedTotal += fv; }
    }
    projTotal = matchTotal + fedTotal;
    if (projTotal > 0 && reqPct !== null) {
      var actualPct = Math.round((matchTotal / projTotal) * 1000) / 10;
      var needed = Math.round((reqPct / 100) * fedTotal / (1 - reqPct / 100));
      if (actualPct < reqPct - 0.05) {
        add("blocker",
          "The non-federal match is " + money(matchTotal) + ", which is " + actualPct + "% of the " + money(projTotal) +
          " total project cost. This notice requires " + reqPct + "% of total approved project cost.",
          "Column: " + headerFor(rows, matchCol),
          "Raise the match to about " + money(needed) + " against this federal request, or cut the federal request to " +
          money(Math.round(matchTotal * (100 - reqPct) / reqPct)) + ". Documented third-party in-kind counts where the notice allows it.");
      } else {
        add("clean", "The non-federal match is " + actualPct + "% of total project cost, meeting the " + reqPct + "% requirement.", "Column: " + headerFor(rows, matchCol), "");
      }
    } else if (projTotal > 0 && reqPct === null && cs.required === true) {
      add("note", "A match is required but the notice's percentage was not captured. The budget shows " + money(matchTotal) + " non-federal.", "", "Confirm the required percentage and its basis (total project cost vs federal share) in the notice.");
    }
  } else if (cs.required === true) {
    add("blocker", "This notice requires a non-federal match, and the budget has no match or in-kind column.", "", "Add a non-federal column and document each match source in the budget narrative.");
  }

  /* --- 6. the federal request against ceiling and floor --- */
  var aw = (brief && brief.award) || {};
  var ceiling = num(aw.ceiling), floor = num(aw.floor);
  if (fedCol >= 0) {
    var fedAsk = null;
    for (var r7 = rows.length - 1; r7 >= 1; r7--) {
      if (isTotalRow(rowLabel(rows[r7]))) { var fv7 = num(rows[r7][fedCol]); if (fv7 !== null) { fedAsk = fv7; break; } }
    }
    if (fedAsk !== null) {
      if (ceiling !== null && fedAsk > ceiling) {
        add("blocker", "The federal request of " + money(fedAsk) + " is above this notice's award ceiling of " + money(ceiling) + ".", "Federal total", "Cut the request to the ceiling or below. A request over the ceiling is commonly rejected without review.");
      } else if (floor !== null && fedAsk < floor) {
        add("fix", "The federal request of " + money(fedAsk) + " is below the award floor of " + money(floor) + ".", "Federal total", "Raise the request above the floor or reconsider applying.");
      } else if (ceiling !== null) {
        add("clean", "The federal request of " + money(fedAsk) + " sits inside the " + money(floor === null ? 0 : floor) + "–" + money(ceiling) + " award range.", "Federal total", "");
      }
    }
  }

  /* --- 7. hygiene --- */
  var seen = {}, blanks = [], negs = [];
  for (var r8 = 1; r8 < rows.length; r8++) {
    var l8 = rowLabel(rows[r8]);
    if (isTotalRow(l8)) continue;
    var key = l8.toLowerCase();
    if (seen[key]) add("fix", "Two line items share the label \"" + l8 + "\".", "Row: " + l8, "Rename one, or combine them if they are the same cost.");
    seen[key] = true;
    var allBlank = cols.every(function (c) { return !isStr(rows[r8][c]); });
    if (allBlank) blanks.push(l8);
    cols.forEach(function (c) { var v = num(rows[r8][c]); if (v !== null && v < 0) negs.push(l8 + " (" + headerFor(rows, c) + ")"); });
  }
  if (blanks.length) add("fix", "Line items with no amount in any money column: " + blanks.slice(0, 6).join("; ") + (blanks.length > 6 ? " and " + (blanks.length - 6) + " more" : "") + ".", "", "Give every line an amount, or delete the row.");
  if (negs.length) add("fix", "Negative amounts: " + negs.slice(0, 6).join("; ") + ".", "", "Budgets are stated positive; show reductions in the narrative, not as negative lines.");

  return out;
}

/* Narrative checks: counting, not comprehension. 12-point double-spaced
   runs about 250 words to the page, which is what reviewers see. */
function checkNarrative(text, brief, criterion) {
  var out = [];
  function add(sev, claim, where, fix) { out.push({ severity: sev, claim: claim, where: where || "", fix: fix || "", source: "arithmetic" }); }
  var t = String(text || "");
  var words = t.split(/\s+/).filter(Boolean).length;
  var chars = t.length;
  var sub = (brief && brief.submission) || {};
  var spacing = txt(sub.spacing) || "";
  var perPage = /double/i.test(spacing) ? 250 : (/single/i.test(spacing) ? 500 : 250);
  var pages = Math.ceil(words / perPage);
  var limit = num(sub.pageLimit);

  add("clean", words.toLocaleString() + " words, " + chars.toLocaleString() + " characters — about " + pages + " page" + (pages === 1 ? "" : "s") + " at " + perPage + " words per page" + (spacing ? " (" + spacing.toLowerCase() + ")" : "") + ".", "", "");

  if (limit !== null) {
    if (pages > limit) {
      add("blocker", "This runs about " + pages + " pages against a " + limit + "-page limit. Roughly " + ((pages - limit) * perPage).toLocaleString() + " words have to come out — and reviewers do not read past the limit.",
        "", "Cut to about " + (limit * perPage).toLocaleString() + " words, or move material the notice excludes from the count (work plan, logic model, letters) into its own attachment.");
    } else if (pages >= limit - 1) {
      add("note", "About " + pages + " pages against a " + limit + "-page limit — no room left for formatting drift.", "", "Leave a page of headroom; tables and headings expand once the real formatting is applied.");
    } else {
      add("clean", "About " + pages + " pages against a " + limit + "-page limit — " + (limit - pages) + " pages of headroom.", "", "");
    }
  }

  if (isStr(sub.font) || isStr(sub.margins)) {
    add("note", "Formatting cannot be checked from pasted text. The notice requires: " + [txt(sub.font), txt(sub.spacing), txt(sub.margins)].filter(Boolean).join(", ") + ".",
      "", "Verify font, spacing, margins and page numbering in the final PDF before submitting.");
  }

  var placeholders = t.match(/\b(TBD|TODO|XXX+|lorem ipsum|\[insert[^\]]*\]|\[name\]|FIXME)\b/gi);
  if (placeholders) {
    var uniq = Array.from(new Set(placeholders.map(function (s) { return s.toUpperCase(); })));
    add("blocker", "Placeholder text is still in the draft: " + uniq.slice(0, 6).join(", ") + ".", "", "Replace every placeholder. Reviewers read these as an unfinished application.");
  }

  /* A keyword scan against what the criterion asks for. It proves
     absence of a word, never presence of an argument — which is why it
     is a note and why Claude reads the same text afterwards. */
  if (criterion && asArr(criterion.subElements).length) {
    var low = t.toLowerCase();
    var absent = asArr(criterion.subElements).filter(function (se) {
      var w = String(se || "").toLowerCase().match(/[a-z]{5,}/g) || [];
      if (!w.length) return false;
      return !w.some(function (x) { return low.indexOf(x) >= 0; });
    });
    if (absent.length) {
      add("note", "A word scan found nothing matching " + absent.length + " of the " + asArr(criterion.subElements).length +
        " things this criterion asks for: " + absent.slice(0, 5).join("; ") + ".",
        "Criterion: " + txt(criterion.criterion),
        "Check each one is genuinely addressed. This is a word match, not a reading — Claude's review below judges whether the argument is actually there.");
    }
  }
  return out;
}

/* ==================================================================
   6. THE REGISTRATION RUNWAY
   Lead times are calendar days and they run in sequence. If the chain
   is longer than the time left, the deadline is already gone whatever
   the rest of the application looks like.
   ================================================================== */
function computeRunway(done, deadline) {
  var todo = REG_CHAIN.filter(function (s) { return !done[s.key]; });
  var needed = todo.reduce(function (n, s) { return n + s.days; }, 0);
  var left = deadline ? daysUntil(deadline) : null;
  var slack = left === null ? null : left - needed;
  var verdict = "unknown";
  if (slack !== null) verdict = slack < 0 ? "infeasible" : (slack < 7 ? "tight" : "feasible");
  var scale = Math.max(needed, left === null ? needed : left, 1);
  var cum = 0;
  var segs = todo.map(function (s) {
    var start = cum; cum += s.days;
    return { label: s.label, days: s.days, over: left !== null && start >= left, pct: (s.days / scale) * 100 };
  }).filter(function (s) { return s.days > 0; });
  return { todo: todo, needed: needed, left: left, slack: slack, verdict: verdict, segs: segs, scale: scale,
           doneCount: REG_CHAIN.length - todo.length };
}

/* The rubric ledger. One scale across every row: each bar is the
   criterion's share of the total points available, split into what the
   evidence supports now and what is still on the table. */
function RubricLedger(props) {
  var rows = asArr(props.rows);
  if (!rows.length) return h("p.null", null, "No scored criteria were found in the notice.");
  var maxOf = rows.reduce(function (m, r) { return Math.max(m, num(r.maxPoints) || 0); }, 0) || 1;
  return h("div.ledger", null, rows.map(function (r, i) {
    var max = num(r.maxPoints) || 0;
    var got = Math.max(0, Math.min(max, num(r.supportedPoints) === null ? 0 : num(r.supportedPoints)));
    var lift = Math.max(0, Math.min(max - got, num(r.liftPoints) === null ? 0 : num(r.liftPoints)));
    var widthPct = max / maxOf * 100;
    return h("div.crit", { key: i },
      h("div.crit-head", null,
        h("h4", null, txt(r.criterion) || "Unnamed criterion"),
        h("span.crit-pts.mono", null, h("b", null, got), h("span", null, " / " + (max || "—") + " pts"))
      ),
      h("div.crit-track", { style: { width: widthPct + "%" },
          role: "img",
          "aria-label": got + " of " + max + " points supported by the file today" },
        h("div.crit-earn", { style: { width: (max ? (got / max) * 100 : 0) + "%" } }),
        h("div.crit-gap", { style: { width: (max ? ((max - got) / max) * 100 : 0) + "%" } })
      ),
      isStr(r.evidenceOnFile) ? h("p.crit-why", null, h("strong", null, "On file: "), r.evidenceOnFile) : null,
      isStr(r.whatIsMissing) ? h("p.crit-why", null, h("strong", null, "A reviewer would not find: "), r.whatIsMissing) : null,
      isStr(r.howToGainPoints)
        ? h("p.crit-lift", null, lift > 0 ? h("b", null, "+" + lift + " points: ") : h("b", null, "To strengthen: "), r.howToGainPoints)
        : null
    );
  }));
}

function RunwayChart(props) {

/* Criteria as the notice states them — points only, no scoring yet. */

          h("span.crit-pts.mono", null, pts === null ? h("span", null, "not scored") : h(R.Fragment, null, h("b", null, pts), h("span", null, " pts")))
        ),
        pts !== null ? h("div.crit-track", { style: { width: (pts / maxOf) * 100 + "%" } },

      );
    })),
    total ? h("p", { className: "eyebrow", style: { marginTop: "14px" } }, total + " points allocated across stated criteria") : null
  );
}

/* Fuzzy-match a required attachment against the client's document
   registry, so the gap list knows what is already in the binder. */
function matchDoc(name, docs) {
  var want = String(name || "").toLowerCase().match(/[a-z0-9]{4,}/g) || [];
  if (!want.length) return null;
  var best = null, bestScore = 0;
  asArr(docs).forEach(function (d) {
    var have = String(d.name || "").toLowerCase();
    var hits = want.filter(function (w) { return have.indexOf(w) >= 0; }).length;
    var score = hits / want.length;
    if (score > bestScore) { bestScore = score; best = d; }
  });
  return bestScore >= 0.5 ? best : null;
}

/* ---------- 7. Packet ---------- */
function buildMemo(client, brief, assess, runway, docs, intake) {
  var b = brief || {}, a = assess || {}, d = b.dates || {};
  var L = [];
  function line(s) { L.push(s === undefined ? "" : s); }
  var deadline = parseDate(d.applicationDeadline);
  var rows = asArr(a.rubricScoring);
  var got = num(a.projectedScore); if (got === null) got = rows.reduce(function (s, r) { return s + (num(r.supportedPoints) || 0); }, 0);
  var max = num(a.projectedMax); if (!max) max = rows.reduce(function (s, r) { return s + (num(r.maxPoints) || 0); }, 0);

  line("# Grant Readiness Assessment");
  line();
  line("**Client:** " + (txt(client.legalName) || "(unnamed)"));
  line("**Opportunity:** " + [txt(b.title), txt(b.opportunityNumber)].filter(Boolean).join(" — "));
  line("**Funder:** " + (txt(b.funder) || txt(intake.funder) || "not stated"));
  line("**Application due:** " + (txt(d.applicationDeadline) || "not stated") +
    (deadline ? " (" + daysUntil(deadline) + " days from today)" : ""));
  line("**Prepared by:** " + PREPARER.firm + " — " + PREPARER.line);
  line("**Prepared:** " + fmtDate(new Date()));
  line();
  line("---");
  line();
  line("## Recommendation");
  line();
  line("**" + (txt(a.recommendation) || "Not assessed") + "**");
  line();
  if (txt(a.rationale)) { line(txt(a.rationale)); line(); }
  line("- Projected reviewer score: **" + got + " of " + (max || "—") + "**");
  line("- Readiness index: **" + (num(a.readinessTotal) === null ? "—" : num(a.readinessTotal)) + " of 100**");
  if (runway && runway.left !== null) {
    line("- Registration runway: " + runway.needed + " days of lead time against " + runway.left +
      " days remaining (" + runway.verdict + ")");
  }
  if (num(a.estimatedEffortHours) !== null) line("- Estimated writing and assembly effort: " + num(a.estimatedEffortHours) + " hours");
  line();
  line("## Eligibility");
  line();
  asArr(a.eligibility).forEach(function (g) {
    var s = g.met === true ? "MET" : (g.met === false ? (g.blocking ? "FAILS (hard gate)" : "NOT MET") : "UNKNOWN");
    line("- **" + s + "** — " + (txt(g.requirement) || "") + (txt(g.evidence) ? " _" + txt(g.evidence) + "_" : ""));
  });
  if (!asArr(a.eligibility).length) line("_Not assessed._");
  line();
  line("## Scoring rubric");
  line();
  if (rows.length) {
    line("| Criterion | Supported today | Maximum | Reachable | What earns it |");
    line("| --- | --- | --- | --- | --- |");
    rows.forEach(function (r) {
      line("| " + (txt(r.criterion) || "") + " | " + (num(r.supportedPoints) === null ? "—" : num(r.supportedPoints)) +
        " | " + (num(r.maxPoints) === null ? "—" : num(r.maxPoints)) +
        " | " + ((num(r.liftPoints) || 0) > 0 ? "+" + num(r.liftPoints) : "—") +
        " | " + (txt(r.howToGainPoints) || "").replace(/\|/g, "/") + " |");
    });
  } else line("_No rubric captured._");
  line();
  if (txt(a.competitiveRead)) { line("**Competitive read.** " + txt(a.competitiveRead)); line(); }
  line("## What is still needed");
  line();
  BINDER_TABS.forEach(function (t) {
    var list = asArr(a.missingItems).filter(function (i) { return num(i.binderTab) === t.n; });
    if (!list.length) return;
    line("### Binder tab " + t.n + " — " + t.label);
    list.forEach(function (i) {
      line("- " + (i.blocksSubmission ? "**[BLOCKS SUBMISSION]** " : "") + (txt(i.item) || "") +
        (num(i.leadTimeDays) !== null ? " — " + num(i.leadTimeDays) + " days lead" : "") +
        (txt(i.owner) ? " — owner: " + txt(i.owner) : "") +
        (txt(i.why) ? "\n  - " + txt(i.why) : ""));
    });
    line();
  });
  var unfiled = asArr(a.missingItems).filter(function (i) { var t = num(i.binderTab); return t === null || t < 1 || t > 6; });
  if (unfiled.length) {
    line("### Not filed against a binder tab");
    unfiled.forEach(function (i) { line("- " + (txt(i.item) || "")); });
    line();
  }
  if (!asArr(a.missingItems).length) { line("_No gap list captured._"); line(); }
  line("## Registration chain");
  line();
  REG_CHAIN.forEach(function (s) {
    var done = runway && runway.todo.every(function (t) { return t.key !== s.key; });
    line("- [" + (done ? "x" : " ") + "] " + s.label + (done ? "" : " — " + s.days + " days lead"));
  });
  line();
  line("## Documents on file");
  line();
  BINDER_TABS.forEach(function (t) {
    var list = asArr(docs).filter(function (x) { return x.tab === t.n; });
    if (!list.length) return;
    line("**Tab " + t.n + " — " + t.label + "**");
    list.forEach(function (x) { line("- " + x.name + ": " + x.status + (isStr(x.note) ? " — " + x.note : "")); });
    line();
  });
  if (asArr(b.redFlags).length) {
    line("## Flags from the notice");
    line();
    asArr(b.redFlags).forEach(function (f) { line("- " + txt(f)); });
    line();
  }
  line("---");
  line();
  line("Scores in this memo are an internal assessment of what the client's file currently evidences. They are not a prediction of the funder's decision. Every figure marked Pending is unverified and was scored as unsupported.");
  line();
  line(PREPARER.firm + " · " + PREPARER.contact + " · " + PREPARER.phone);
  return L.join("\n");
}

function PacketTab(props) {

  var forms = asArr(b.requiredForms), atts = asArr(b.requiredAttachments);

/* What the client record already implies about the registration chain.
   Used only to seed a new client; after that the checkboxes are the
   record, because a person looked. */
function deriveRegDone(c) {
  var samActive = /active/i.test(String(c.samStatus || "")) && !isPending(c.samStatus);
  var exp = parseDate(c.samExpires);
  var unexpired = exp ? daysUntil(exp) > 0 : false;
  return {
    ein: isStr(c.ein) && !isPending(c.ein),
    sam: samActive && unexpired,
    uei: isStr(c.uei) && !isPending(c.uei),
    grantsgov: /register|active|complete/i.test(String(c.grantsGovStatus || "")) && !isPending(c.grantsGovStatus),
    aor: isStr(c.aorName) && !isPending(c.aorName),
    workspace: false,
    validate: false
  };
}

  function touch() { if (loadedRef.current) setDirty(true); }

  function runSearch() {

      noticeText: seedFromGrant(g),
      funder: txt(g.funder_name) || "",
      portal: g.source === "government" ? "Grants.gov" : (txt(g.intake_type) === "loi" ? "Funder portal — letter of intent first" : "Funder portal"),
      sourceUrl: url,
      foundVia: "Kindora live search"
    });
    setBrief(null); setAssess(null); setError(null);
    var el = document.getElementById("nofo-text");
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  var deadline = brief ? parseDate((brief.dates || {}).applicationDeadline) : null;
  var runway = useMemo(function () { return computeRunway(regDone, deadline); }, [regDone, deadline]);

  /* --- Pass A then Pass B --- */
  function analyze() {
    var sample = sampleRef.current;
    if (!sample) { setError(ERR_COPY.not_granted); return; }
    var text = intake.noticeText.trim();
    if (!text) return;

    var ctl = new AbortController();
    abortRef.current = ctl;
    setError(null); setBrief(null); setAssess(null); setStreamChars(0);

    var chunks = chunkText(text);
    setPass({ done: 0, total: chunks.length });

    var onText = function (u) { setStreamChars(u.text.length); };
    var again = !!brief;
    var cacheOpt = { gcTime: 86400000, refresh: again };
    var opts = { signal: ctl.signal, modelTier: "complex", onText: onText, cache: cacheOpt };

    setPhase("extract");
    var run = sample.json(promptExtract(chunks[0], 1, chunks.length), opts);

    for (var i = 1; i < chunks.length; i++) {
      (function (j) {
        run = run.then(function (acc) {
          setPass({ done: j, total: chunks.length });
          setStreamChars(0);
          return sample.json(promptExtract(chunks[j], j + 1, chunks.length), opts).then(function (next) {
            if (JSON.stringify(acc).length > 45000) return acc;
            setPhase("merge"); setStreamChars(0);
            return sample.json(promptMerge(acc, next), opts).then(function (m) { setPhase("extract"); return m; });
          });
        });
      })(i);
    }

    run.then(function (b) {
      if (ctl.signal.aborted) return null;
      if (!b || typeof b !== "object") throw { code: "invalid_json", message: "" };
      setBrief(b);
      setPass({ done: chunks.length, total: chunks.length });
      setTab("notice");
      setPhase("score"); setStreamChars(0);
      return sample.json(promptAssess(client, docs, b), { signal: ctl.signal, modelTier: "complex", onText: onText, cache: cacheOpt });
    }).then(function (a) {
      if (ctl.signal.aborted || !a) return;
      setAssess(a);
      setPhase(null);
      setTab("gates");
    }).catch(function (e) {
      setPhase(null);
      if (e && e.code === "cancelled") { setError(null); return; }
      setError(errCopy(e));
    });
  }

  /* --- the document check: arithmetic here, then Claude --- */
  function runCheck() {
    var content = check.content.trim();
    if (!content) return;
    var isSheet = check.kind === "Budget spreadsheet";
    var rows = isSheet ? (asArr(check.rows).length ? check.rows : parseDelimited(content)) : [];
    var criteria = asArr(brief && brief.reviewCriteria);
    var chosen = criteria.filter(function (c) { return txt(c.criterion) === check.criterion; })[0] || null;
    var computed = isSheet ? checkBudget(rows, brief) : checkNarrative(content, brief, chosen);

    setCheck(Object.assign({}, check, { rows: rows, computed: computed, ai: null }));
    setError(null);

    var sample = sampleRef.current;
    if (!sample) { setError(ERR_COPY.not_granted); return; }

    var ctl = new AbortController();
    abortRef.current = ctl;
    setPhase("check"); setStreamChars(0);

    sample.json(promptDocCheck(check.kind, check.label, content, computed, brief, chosen ? txt(chosen.criterion) + " — " + txt(chosen.whatReviewersLookFor) : null), {
      signal: ctl.signal, modelTier: "complex", cache: { gcTime: 3600000 },
      onText: function (u) { setStreamChars(u.text.length); }
    }).then(function (a) {
      if (ctl.signal.aborted) return;
      setCheck(function (prev) { return Object.assign({}, prev, { ai: a }); });
      setPhase(null);
    }).catch(function (e) {
      setPhase(null);
      if (e && e.code === "cancelled") { setError(null); return; }
      setError(errCopy(e));
    });
  }

  function stop() { if (abortRef.current) abortRef.current.abort(); setPhase(null); }

  function saveMemo(memo) {
    var dl = dlRef.current;
    if (!dl) return;
    var name = (txt(client.legalName) || "Client").replace(/[^A-Za-z0-9 _-]/g, "").slice(0, 60);
    var opp = (txt(brief && brief.opportunityNumber) || "opportunity").replace(/[^A-Za-z0-9_-]/g, "");
    dl.save({ filename: name + " - Grant Readiness - " + opp + ".md", data: memo })
      .catch(function () { setError("The file was not saved. Copy the memo instead."); });
  }
  function copyMemo(memo) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(memo).then(function () {
        setCopied(true); window.setTimeout(function () { setCopied(false); }, 2000);
      }, function () { setError("Could not reach the clipboard. Select the memo text below and copy it."); });
    } else {
      var el = document.getElementById("memo-out");
      if (el) { el.focus(); el.select(); }
    }
  }

  var steps = useMemo(function () {
    function st(id) {
      var order = ["extract", "merge", "score"];
      if (!phase) return "";
      if (id === phase) return "now";
      return order.indexOf(id) < order.indexOf(phase) ? "done" : "";
    }
    var readLabel = pass.total > 1
      ? "Reading the notice (" + Math.min(pass.done + 1, pass.total) + " of " + pass.total + ")"
      : "Reading the notice";
    var arr = [{ label: readLabel, state: st("extract") }];
    if (pass.total > 1) arr.push({ label: "Merging passes", state: st("merge") });
    arr.push({ label: "Scoring the client", state: st("score") });
    return arr;
  }, [phase, pass]);

  var docLine = brief
    ? h("div.masthead-doc", null,
        h("strong", null, txt(brief.opportunityNumber) || txt(brief.title) || "Notice loaded"),
        [txt(client.legalName), txt(brief.funder) || txt(intake.funder)].filter(Boolean).join(" · "))
    : h("div.masthead-doc", null,
        h("strong", null, "No notice loaded"),
        (txt(client.legalName) || "No client selected") + " · paste a notice on Intake");

  var body;
  if (tab === "intake") {
    body = h(IntakeTab, {
      state: intake, set: function (patch) { setIntake(Object.assign({}, intake, patch)); },
      client: client, phase: phase, steps: steps, streamChars: streamChars,
      error: error, brief: brief, sampleReady: sampleReady,
      onAnalyze: analyze, onStop: stop, go: setTab,
      sources: sources, setSources: setSources, addSource: addSource,
      storageReady: storageReady, dirty: dirty, saving: saving, onSave: saveAll,
      mcpReady: mcpReady, search: search, setSearch: setSearch, hits: hits,
      searching: searching, searched: searched, searchErr: searchErr,
      onSearch: runSearch, onUseHit: useHit
    });
  } else if (tab === "notice") {
    body = brief ? h(NoticeTab, { brief: brief, intake: intake })
                 : h(Empty, { go: setTab, what: "notice" });
  } else if (tab === "gates") {
    body = assess ? h(EligibilityTab, { assess: assess, brief: brief, runway: runway, regDone: regDone, setRegDone: setRegDone })
                  : h(Empty, { go: setTab, what: "assessment" });
  } else if (tab === "rubric") {
    body = assess ? h(RubricTab, { assess: assess, brief: brief })
                  : h(Empty, { go: setTab, what: "assessment" });
  } else if (tab === "needs") {
    body = assess ? h(NeedsTab, { assess: assess, brief: brief, docs: docs })
                  : h(Empty, { go: setTab, what: "assessment" });
  } else if (tab === "check") {
    body = h(CheckTab, {
      state: check, set: function (patch) { setCheck(Object.assign({}, check, patch)); },
      brief: brief, phase: phase, streamChars: streamChars, error: error,
      onCheck: runCheck, onStop: stop
    });
  } else if (tab === "packet") {
    body = h(PacketTab, {
      brief: brief, assess: assess, client: client, docs: docs, intake: intake, runway: runway,
      downloadsReady: downloadsReady, onSaveMemo: saveMemo, onCopyMemo: copyMemo, copied: copied
    });
  } else {
    body = h(ClientTab, {
      client: client, setClient: setClient, docs: docs, setDocs: setDocs,
      clients: clients, pickClient: function (id) { setActiveId(id); },
      addClient: addClient, removeClient: removeClient,
      storageReady: storageReady, dirty: dirty, saving: saving, onSave: saveAll
    });
  }

  return h(R.Fragment, null,
    h("header.masthead", null,
      h("div.masthead-in", null,
        h("div", null,
          h("div.brandmark", null, "Delaware Mobile Signings ", h("em", null, "Grant Desk")),
          h("div.brandsub", null, PREPARER.line)),
        docLine)),
    h("nav.rail", null,
      h("div.rail-in", { role: "tablist" }, TABS.map(function (t) {
        var locked = (t.id === "notice" && !brief) ||
                     ((t.id === "gates" || t.id === "rubric" || t.id === "needs") && !assess);
        return h("button.tab", {
          key: t.id, role: "tab", id: "tab-" + t.id, type: "button",
          "aria-selected": tab === t.id ? "true" : "false",
          disabled: locked && tab !== t.id,
          title: locked ? "Read a notice on the Intake tab first" : null,
          onClick: function () { setTab(t.id); }
        }, h("span.num", null, t.n), t.label);
      }))),
    h("main", { role: "tabpanel", "aria-labelledby": "tab-" + tab }, body)
  );
}

function Empty(props) {
  return h("div.stack", null,
    h(Panel, null,
      h("div.stack-sm", null,
        h("p.eyebrow", null, "Nothing here yet"),
        h("h2", { style: { fontSize: "21px" } }, "No " + props.what + " on file"),
        h("p", { style: { margin: 0, color: "var(--ink-2)", maxWidth: "60ch" } },
          "Paste a funding notice on the Intake tab and run it. The desk reads the notice, then scores the selected client against it."),
        h("div", null, h("button.btn", { onClick: function () { props.go("intake"); } }, "Go to Intake")))));
}

RD.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
